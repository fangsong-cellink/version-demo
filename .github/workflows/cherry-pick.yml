name: Cherry Pick

on:
  issue_comment:
    types: [created]

jobs:
  cherry-pick:
    name: Cherry pick PR to target branch
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/cherry-pick-to ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Acknowledge comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Get PR info and parse command
        id: info
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const match = body.match(/^\/cherry-pick-to\s+(\S+)/);
            if (!match) {
              core.setFailed('Could not parse target branch from comment.');
              return;
            }
            const targetBranch = match[1];

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (!pr.merged) {
              core.setFailed(`PR #${context.issue.number} is not merged.`);
              return;
            }

            core.setOutput('target_branch', targetBranch);
            core.setOutput('merge_commit_sha', pr.merge_commit_sha);
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_number', String(context.issue.number));

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cherry-pick and push
        id: cherry
        env:
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
          COMMIT_SHA: ${{ steps.info.outputs.merge_commit_sha }}
          PR_NUMBER: ${{ steps.info.outputs.pr_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHERRY_BRANCH="cherry-pick/pr-${PR_NUMBER}-to-${TARGET_BRANCH}"
          echo "cherry_branch=${CHERRY_BRANCH}" >> "$GITHUB_OUTPUT"

          git fetch origin "${TARGET_BRANCH}"
          git checkout -b "${CHERRY_BRANCH}" "origin/${TARGET_BRANCH}"
          git cherry-pick "${COMMIT_SHA}"
          git push --force-with-lease origin "${CHERRY_BRANCH}"

      - name: Create pull request
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
          CHERRY_BRANCH: ${{ steps.cherry.outputs.cherry_branch }}
          PR_TITLE: ${{ steps.info.outputs.pr_title }}
          PR_NUMBER: ${{ steps.info.outputs.pr_number }}
        with:
          script: |
            const { data: newPr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Cherry Pick-${process.env.TARGET_BRANCH}] ${process.env.PR_TITLE}`,
              body: `Cherry pick of #${process.env.PR_NUMBER} to \`${process.env.TARGET_BRANCH}\`.\n\nRequested by @${context.actor}.`,
              head: process.env.CHERRY_BRANCH,
              base: process.env.TARGET_BRANCH,
            });

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: `Cherry-pick PR created: ${newPr.html_url}`,
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Failed to create cherry-pick PR. Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details (e.g. merge conflicts).`,
            });
