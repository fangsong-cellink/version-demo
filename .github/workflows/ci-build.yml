name: CI Build

on:
  push:
    branches:
      - dev
      - 'release/*'
    tags:
      - 'release/*'
  pull_request:
    branches:
      - dev
      - 'release/*'
  workflow_dispatch:

jobs:
  build:
    name: Build (frontend + Tauri)
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.7.x'
      
      - name: Determine Version
        id: gitversion # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Write frontend build info
        run: |
          mkdir -p src
          cat > src/build-info.json <<'EOF'
          {
            "version": "${{ steps.gitversion.outputs.SemVer }}",
            "buildId": "${{ env.BUILD_ID }}",
            "commitSha": "${{ github.sha }}"
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend dependencies
        run: pnpm ci
        
      - name: Build frontend
        run: pnpm build
        env:
          APP_VERSION: ${{ steps.gitversion.outputs.SemVer }}
          BUILD_ID: ${{ env.BUILD_ID }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist

      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: tauri-release
      #     path: src-tauri/target/release

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Zip frontend dist
        run: zip -r frontend-dist.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: frontend-dist.zip
          generate_release_notes: true
